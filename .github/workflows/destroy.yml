name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      env:
        description: "要销毁的环境（资源组保留）"
        type: choice
        options: [tf, tf-test]
        default: tf
      scope:
        description: "销毁范围；tf-test 只接受 all"
        type: choice
        options: [all, azlandingzone, network]
        default: all
      confirm:
        description: "精确输入 DESTROY；Key Vault 和日志仅软删除，不永久清除"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.env == 'tf' && 'production' || 'test' }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ inputs.env == 'tf' && vars.TERRAFORM_PROD_AZURE_CLIENT_ID || vars.TERRAFORM_TEST_AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.TERRAFORM_AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.TERRAFORM_AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      ARM_USE_CLI: false
      TF_IN_AUTOMATION: true
      DESTROY_CONFIRM: ${{ inputs.confirm }}
      DESTROY_ENV: ${{ inputs.env }}
      DESTROY_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate literal inputs
        run: bash .github/scripts/check_destroy_inputs.sh
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Terraform init
        run: terraform -chdir="$DESTROY_ENV" init -input=false -lockfile=readonly
      - name: Destroy managed resources without purging retained data
        run: |
          targets=()
          if [[ "$DESTROY_ENV" == tf && "$DESTROY_SCOPE" != all ]]; then
            targets=("-target=module.$DESTROY_SCOPE")
          fi
          if ! terraform -chdir="$DESTROY_ENV" destroy "${targets[@]}" -input=false -lock-timeout=5m -no-color -auto-approve -var-file=terraform.tfvars > "$RUNNER_TEMP/destroy.log" 2>&1; then
            echo '::error::Terraform destroy failed; raw logs are not published.'
            exit 1
          fi
          echo 'Destroy completed. Resource groups remain; Key Vault and Log Analytics are not purged.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove raw logs
        if: always()
        run: rm -f "$RUNNER_TEMP/destroy.log"
