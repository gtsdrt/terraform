name: Terraform PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'tf/**'
      - 'tf-test/**'

permissions:
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.TERRAFORMEXECUTOR_AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.TERRAFORMEXECUTOR_AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.TERRAFORMEXECUTOR_AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.TERRAFORMEXECUTOR_AZURE_TENANT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [tf, tf-test]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -no-color -input=false -var-file=terraform.tfvars -out=tfplan
        continue-on-error: true
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.dir }}
          path: ${{ matrix.dir }}/tfplan
          retention-days: 1
      - name: Comment plan result
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const outcome = '${{ steps.plan.outcome }}';
            const dir = '${{ matrix.dir }}';
            const body = `## Terraform Plan — \`${dir}\`\n\n**Status:** ${outcome}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });