name: Terraform Plan on PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'tf/**'
      - 'tf-test/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write   # 用于贴评论

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [tf, tf-test]     # 两个环境都检查
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"   # 和容器镜像里的版本对齐

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      - name: 把 plan 结果贴到 PR 评论
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            let output = '';
            try {
              output = execSync(
                'terraform show -no-color tfplan',
                { cwd: '${{ matrix.dir }}', maxBuffer: 1024*1024*10 }
              ).toString();
            } catch (e) {
              output = '(plan 失败，请看 workflow 日志)';
            }
            // 评论截断，防止超大
            if (output.length > 60000) output = output.slice(0, 60000) + '\n... (已截断)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Terraform Plan — \`${{ matrix.dir }}\`\n\n\`\`\`\n${output}\n\`\`\``
            });
