name: Trigger auto deployment for terraform-executor

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/terraform-executor-AutoDeployTrigger-6b4b3e66-6082-408f-ab81-1cc5a12b10ea.yml'

  # Allow manual trigger 
  workflow_dispatch:      


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: Dockerfile
          _targetLabelKey_: build
          registryUrl: gtsdrtterraform.azurecr.io
          registryUsername: ${{ secrets.TERRAFORMEXECUTOR_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TERRAFORMEXECUTOR_REGISTRY_PASSWORD }}
          containerAppName: terraform-executor
          resourceGroup: terraform
          imageToBuild: gtsdrtterraform.azurecr.io/terraform-executor:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_
        # ===== 在原有 build-and-deploy job 之后追加 =====
  terraform-apply:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment: production
    concurrency: terraform-prod

    steps:
      - name: 等容器重启就绪
        run: sleep 60

      - name: Terraform plan（预览）
        run: |
          # 1. 发送请求，保存响应和状态码（去掉 -f！）
          HTTP_CODE=$(curl -s -w "%{http_code}" \
            -X POST "${{ vars.TERRAFORM_EXECUTOR_URL }}/terraform/plan" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.TERRAFORM_EXECUTOR_API_KEY }}" \
            -d '{"workspace":"default"}' \
            -o /tmp/tf_plan.json)

          echo "HTTP Status: $HTTP_CODE"
          echo "Raw Response:"
          cat /tmp/tf_plan.json || echo "(empty)"
          echo ""

          # 2. 检查状态码
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Error: API returned HTTP $HTTP_CODE"
            exit 1
          fi

          # 3. 安全解析 JSON
          python3 -c "
          import json, sys
          try:
              with open('/tmp/tf_plan.json') as f:
                  d = json.load(f)
              print(d.get('stdout', ''))
              if d.get('stderr'):
                  print('STDERR:', d.get('stderr'), file=sys.stderr)
              if not d.get('detail', {}).get('success', True):
                  sys.exit(1)
          except json.JSONDecodeError as e:
              print(f'Invalid JSON response: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Terraform apply
        run: |
          HTTP_CODE=$(curl -s -w "%{http_code}" \
            -X POST "${{ vars.TERRAFORM_EXECUTOR_URL }}/terraform/apply" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.TERRAFORM_EXECUTOR_API_KEY }}" \
            -d '{"workspace":"default"}' \
            -o /tmp/tf_apply.json)

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/tf_apply.json || echo "(empty)"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Error: API returned HTTP $HTTP_CODE"
            exit 1
          fi

          python3 -c "
          import json, sys
          with open('/tmp/tf_apply.json') as f:
              d = json.load(f)
          detail = d.get('detail', d)
          print(detail.get('stdout', ''))
          if not detail.get('success'):
              print(detail.get('stderr', ''), file=sys.stderr)
              sys.exit(1)
          "