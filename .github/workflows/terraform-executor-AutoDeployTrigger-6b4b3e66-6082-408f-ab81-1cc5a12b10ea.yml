name: Trigger auto deployment for terraform-executor

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/terraform-executor-AutoDeployTrigger-6b4b3e66-6082-408f-ab81-1cc5a12b10ea.yml'

  # Allow manual trigger 
  workflow_dispatch:      


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: Dockerfile
          _targetLabelKey_: build
          registryUrl: gtsdrtterraform.azurecr.io
          registryUsername: ${{ secrets.TERRAFORMEXECUTOR_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TERRAFORMEXECUTOR_REGISTRY_PASSWORD }}
          containerAppName: terraform-executor
          resourceGroup: terraform
          imageToBuild: gtsdrtterraform.azurecr.io/terraform-executor:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_
        # ===== 在原有 build-and-deploy job 之后追加 =====
  terraform-apply:
        needs: build-and-deploy
        runs-on: ubuntu-latest
        environment: production          # ← 关键：挂审批闸，有人点 Approve 才会往下走
        concurrency: terraform-prod      # 防止两个人同时触发 apply

        steps:
          - name: 等容器重启就绪
            run: sleep 60

          - name: Terraform plan（预览，写入日志）
            run: |
              curl -sf -X POST "${{ vars.TERRAFORM_EXECUTOR_URL }}/terraform/plan" \
                -H "X-API-Key: ${{ secrets.TERRAFORM_EXECUTOR_API_KEY }}" \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('stdout','')); print(d.get('stderr',''))"

          - name: Terraform apply
            run: |
              curl -sf -X POST "${{ vars.TERRAFORM_EXECUTOR_URL }}/terraform/apply" \
                -H "X-API-Key: ${{ secrets.TERRAFORM_EXECUTOR_API_KEY }}" \
                | python3 -c "
              import json, sys
              d = json.load(sys.stdin)
              detail = d.get('detail', d)
              print(detail.get('stdout', ''))
              if not detail.get('success'):
                  print(detail.get('stderr', ''))
                  sys.exit(1)
              "


