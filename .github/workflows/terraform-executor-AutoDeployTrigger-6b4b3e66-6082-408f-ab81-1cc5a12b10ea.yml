name: Trigger auto deployment for terraform-executor

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/terraform-executor-AutoDeployTrigger-6b4b3e66-6082-408f-ab81-1cc5a12b10ea.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TERRAFORMEXECUTOR_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
         appSourcePath: ${{ github.workspace }}
         acrName: gtsdrtterraform
         containerAppName: terraform-executor
         resourceGroup: terraform
         containerAppEnvironment: terraform-env
         imageToBuild: gtsdrtterraform.azurecr.io/terraform-executor:${{ github.sha }}
         targetPort: 8000



